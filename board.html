<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>술객 점성술 | 게시판</title><style>body{margin:0;background:#fbf8f2;color:#142039;font-family:'Malgun Gothic',sans-serif}header{background:#081527;color:#edc985;padding:22px}main{max-width:900px;margin:35px auto;padding:0 18px}h1{margin:0}a{color:inherit}button,input,textarea,select{font:inherit;padding:11px;border:1px solid #ccc;border-radius:5px}button{background:#142039;color:white;cursor:pointer}button:disabled{opacity:.5}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:160px}.panel{background:white;padding:22px;border-radius:9px;margin:18px 0;box-shadow:0 2px 12px #0001}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}label{display:block;margin:12px 0 5px}article{border-bottom:1px solid #ddd;padding:15px 0}article button{background:transparent;color:#142039;border:0;text-align:left;padding:0;font-weight:bold}.muted{color:#667;font-size:13px}.error{color:#a22}#message{white-space:pre-wrap}</style></head><body><header><a href="index.html">← 홈페이지</a><h1>✺ 술객 점성술 게시판</h1></header><main><div class="panel"><label for="category">게시판 선택</label><select id="category"><option value="courses">강의</option><option value="consult">상담 안내</option><option value="learn">고전점성술 배우기</option><option value="questions">질문게시판</option><option value="resources">자료실</option><option value="community">커뮤니티</option><option value="members">회원게시판</option></select><p id="message" role="status" class="muted"></p></div><div class="panel" id="auth"><h2>회원가입 · 로그인</h2><label>이메일<input type="email" id="email" autocomplete="email"></label><label>비밀번호 (6자 이상)<input type="password" id="password" autocomplete="current-password"></label><div class="row"><button id="login">로그인</button><button id="signup">회원가입</button><button id="logout" hidden>로그아웃</button></div><p id="user" class="muted"></p></div><div class="panel" id="editor" hidden><h2>글쓰기</h2><label>제목<input id="title" maxlength="150"></label><label>본문<textarea id="body" maxlength="30000"></textarea></label><button id="save">게시글 등록</button></div><div class="panel"><h2>게시글 목록</h2><div id="posts">불러오는 중...</div></div><div class="panel" id="detail" hidden><h2 id="detail-title"></h2><p id="detail-meta" class="muted"></p><p id="detail-body" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><button id="delete" hidden>내 글 삭제</button><section id="replies"><h3>댓글 · 답변</h3><div id="reply-list"></div><div id="reply-editor" hidden><textarea id="reply-body" placeholder="답변을 입력하세요" maxlength="10000"></textarea><button id="reply-save">답변 등록</button></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const db=window.supabase.createClient('https://uxjhdzmmlclwfpvmwgra.supabase.co','sb_publishable_n6C_ltecguzbyafrSm9MKg_0MZKXlYz');
const el=id=>document.getElementById(id), notice=(t,bad=false)=>{el('message').textContent=t;el('message').className=bad?'error':'muted'};let currentUser=null,currentPost=null;const categories=['courses','consult','learn','questions','resources','community','members'];const initial=new URLSearchParams(location.search).get('category');if(categories.includes(initial))el('category').value=initial;
async function refreshAuth(){const {data,error}=await db.auth.getUser();currentUser=error?null:data.user;el('editor').hidden=!currentUser;el('logout').hidden=!currentUser;el('login').hidden=!!currentUser;el('signup').hidden=!!currentUser;el('user').textContent=currentUser?'로그인: '+currentUser.email:'글쓰기와 답변은 로그인 후 가능합니다.';el('reply-editor').hidden=!currentUser||!currentPost;el('delete').hidden=!currentUser||!currentPost||currentPost.user_id!==currentUser.id;}
async function load(){currentPost=null;el('detail').hidden=true;el('posts').textContent='불러오는 중...';const {data,error}=await db.from('posts').select('id,title,created_at,user_id').eq('category',el('category').value).order('created_at',{ascending:false}).limit(100);if(error){el('posts').textContent='게시글을 불러올 수 없습니다. Supabase SQL 설정을 확인하세요.';notice(error.message,true);return}el('posts').replaceChildren();if(!data.length){el('posts').textContent='아직 게시글이 없습니다.';return}for(const post of data){const a=document.createElement('article'),b=document.createElement('button'),p=document.createElement('p');b.textContent=post.title;b.onclick=()=>openPost(post.id);p.className='muted';p.textContent=new Date(post.created_at).toLocaleString('ko-KR');a.append(b,p);el('posts').append(a)}}
async function openPost(id){const {data,error}=await db.from('posts').select('*').eq('id',id).single();if(error){notice(error.message,true);return}currentPost=data;el('detail').hidden=false;el('detail-title').textContent=data.title;el('detail-meta').textContent=new Date(data.created_at).toLocaleString('ko-KR');el('detail-body').textContent=data.body;await refreshAuth();await loadReplies();el('detail').scrollIntoView({behavior:'smooth'});}
async function loadReplies(){const {data,error}=await db.from('replies').select('id,body,created_at').eq('post_id',currentPost.id).order('created_at',{ascending:true});el('reply-list').replaceChildren();if(error){el('reply-list').textContent='답변을 불러오지 못했습니다.';return}for(const reply of data){const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('small');p.style.whiteSpace='pre-wrap';p.textContent=reply.body;s.textContent=new Date(reply.created_at).toLocaleString('ko-KR');a.append(p,s);el('reply-list').append(a)}}
async function authenticate(signup){const email=el('email').value.trim(),password=el('password').value;if(!email||password.length<6){notice('이메일과 6자 이상의 비밀번호를 입력하세요.',true);return}const {error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(error){notice(error.message,true);return}notice(signup?'회원가입 요청 완료. 인증 메일이 발송되었다면 이메일을 확인하세요.':'로그인했습니다.');await refreshAuth()}
el('login').onclick=()=>authenticate(false);el('signup').onclick=()=>authenticate(true);el('logout').onclick=async()=>{await db.auth.signOut();await refreshAuth()};el('category').onchange=()=>{history.replaceState(null,'','?category='+el('category').value);load()};el('save').onclick=async()=>{if(!currentUser)return notice('로그인이 필요합니다.',true);const title=el('title').value.trim(),body=el('body').value.trim();if(!title||!body)return notice('제목과 본문을 입력하세요.',true);el('save').disabled=true;const {error}=await db.from('posts').insert({category:el('category').value,title,body,user_id:currentUser.id});el('save').disabled=false;if(error)return notice(error.message,true);el('title').value='';el('body').value='';notice('게시글이 등록되었습니다.');await load()};el('reply-save').onclick=async()=>{if(!currentUser||!currentPost)return;const body=el('reply-body').value.trim();if(!body)return;const {error}=await db.from('replies').insert({post_id:currentPost.id,user_id:currentUser.id,body});if(error)return notice(error.message,true);el('reply-body').value='';await loadReplies()};el('delete').onclick=async()=>{if(!currentUser||!currentPost||currentPost.user_id!==currentUser.id)return;if(!confirm('내 글을 삭제하시겠습니까?'))return;const {error}=await db.from('posts').delete().eq('id',currentPost.id).eq('user_id',currentUser.id);if(error)return notice(error.message,true);notice('삭제했습니다.');await load()};db.auth.onAuthStateChange(()=>{setTimeout(refreshAuth,0)});refreshAuth();load();
</script></body></html>
